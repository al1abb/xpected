<div id="team-search" class="relative min-w-0 flex-1 sm:max-w-xs">
  <span aria-hidden="true" class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-sm text-gray-400 dark:text-gray-500">🔎</span>
  <input type="search" name="q" id="team-search-input"
         placeholder="Search teams…" autocomplete="off" spellcheck="false"
         role="combobox" aria-expanded="false" aria-autocomplete="list"
         aria-controls="team-search-results"
         hx-get="/search/teams"
         hx-trigger="keyup changed delay:250ms, search, focus[this.value.length>1]"
         hx-target="#team-search-results"
         hx-swap="innerHTML"
         hx-sync="this:replace"
         hx-indicator="#team-search-spinner"
         class="w-full rounded-lg border border-gray-200 bg-gray-50 py-1.5 pl-8 pr-8 text-sm text-gray-900 placeholder:text-gray-500 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-[color:var(--comp-accent)] dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100 dark:placeholder:text-gray-400">
  <span id="team-search-spinner" aria-hidden="true"
        class="pointer-events-none absolute right-2.5 top-1/2 hidden h-3.5 w-3.5 -translate-y-1/2 animate-spin rounded-full border-2 border-gray-300 border-t-transparent dark:border-gray-600 dark:border-t-transparent [&.htmx-request]:block"></span>

  <div id="team-search-results" role="listbox" aria-label="Team search results"
       class="absolute left-0 right-0 top-full z-50 mt-1.5 overflow-hidden rounded-xl border border-gray-200 bg-white shadow-xl empty:hidden dark:border-gray-700 dark:bg-gray-900"></div>
</div>
