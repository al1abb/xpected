name: Daily data refresh

# Pulls new results/fixtures from every source, refits the model, and
# regenerates predictions (scripts/refresh.py) — then commits the updated
# data/app.db and pushes. Vercel is git-linked to this repo, so that push
# alone triggers a production redeploy; nothing here talks to Vercel
# directly. Sundays additionally refresh data/backtest_results.json (the
# full walk-forward backtest is too slow to run daily).
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh (weekly backtest on Sundays)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            python scripts/refresh.py --backtest
          else
            python scripts/refresh.py
          fi

      # Every refresh writes one prediction per scheduled match (~2,800, since
      # the scheduled pool runs to the end of the season) and nothing used to
      # remove the superseded ones — ~1.15 MB/day of unbounded growth, in a
      # file that is committed on every run. This keeps only what the site and
      # the accuracy pages actually read; see scripts/prune_predictions.py.
      - name: Prune superseded predictions
        run: python scripts/prune_predictions.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db data/backtest_results.json
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "Daily data refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
