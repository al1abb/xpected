name: Historical appearance backfill

# Runs scripts/backfill_appearances.py — a multi-day, resumable pull of
# per-player minutes/ratings from bigballsdata.com back to 2019/20 (see
# ingest/bigballs_history.py's docstring for why that's reachable on the
# free plan despite /lineups itself being walled to "current + 1 prior
# season"). Building block for model/player_elo.py.
#
# Budget-shared with daily-refresh.yml, which also calls bigballsdata.com
# (current-season lineups/stats) every day, and with close-out-finished.yml,
# whose lineup sync runs every 15 minutes 11:00-23:00 — all against the same
# 2000/day cap. --budget 1000 here leaves real headroom for both. 1500 did
# not: on 2026-09-19 this job hit HTTP 429 after 6 requests, because the
# previous run's 1500 plus that day's lineup syncs were still inside the
# provider's quota window. A 429 or a refused date now stops or skips
# cleanly with a warning (see scripts/backfill_appearances.py) instead of
# failing the run.
#
# --seasons-back 1 (current season only) since 2026-09-25: the free plan now
# answers any earlier date with HTTP 403 history_not_included ("Your plan
# covers the current season only"). Dates are walked oldest first, so
# reaching back further only parks each league behind a wall of refused
# dates — Bundesliga (stopped at 2025-02) and Ligue 1 (never started) could
# not reach this season's matches at all. Everything already collected from
# earlier seasons stays in the cache and in the replay. Raise it via the
# manual run's seasons_back input after a plan upgrade (Solo: 4 prior
# seasons).
#
# State (data/appearances.sqlite: which dates are already done, and every
# appearance collected so far) is deliberately NOT committed to git — see
# that module's docstring for the size reasoning — so it has to survive
# between runs some other way. actions/cache does that: each run saves a
# new cache keyed on its own run id and restores the most recent one tagged
# with the shared prefix, which is the standard pattern for a cache that
# needs to keep growing across runs rather than just avoiding rebuild work.
# A cache miss (first run, or eviction) just means this run starts a fresh
# appearances.sqlite — safe, since backfill_competition() re-derives
# progress from what's actually in it, never from an external counter.
#
# Only data/app.db is committed here, and only because this process also
# resolves player identity as it goes (ingest/resolve_players.py) — new
# Player/PlayerAlias rows are real, durable, and small (no per-appearance
# blob), unlike the raw minutes/rating data that stays in the gitignored
# cache. Scheduled at 03:00 UTC, clear of daily-refresh.yml (06:00) and
# close-out-finished.yml (11:00-23:00), so the two never race for the same
# bigballsdata.com budget or the same app.db write lock.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      budget:
        description: "Max bigballsdata.com requests to spend this run"
        default: "1000"
      seasons_back:
        description: "How many seasons of dates to backfill (1 = current season only)"
        default: "1"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore appearance backfill progress
        uses: actions/cache/restore@v4
        with:
          path: data/appearances.sqlite
          key: appearances-db-${{ github.run_id }}
          restore-keys: |
            appearances-db-

      - name: Run backfill
        env:
          BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
        run: python scripts/backfill_appearances.py --budget "${{ github.event.inputs.budget || '1000' }}" --seasons-back "${{ github.event.inputs.seasons_back || '1' }}"

      - name: Save appearance backfill progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/appearances.sqlite
          key: appearances-db-${{ github.run_id }}

      # This is the only workflow whose data/appearances.sqlite ever has
      # real rows in it (restored above from this workflow's own cache) —
      # daily-refresh.yml has no such cache step, so the equivalent call
      # there computes against an empty file. See
      # scripts/recompute_player_ratings.py's own docstring.
      - name: Recompute player Elo ratings from the deepened backfill
        run: python scripts/recompute_player_ratings.py

      - name: Commit and push if player identity or rating data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db
          if git diff --cached --quiet; then
            echo "No new players resolved or ratings changed, skipping commit."
          else
            git commit -m "Historical appearance backfill: $(date -u +%Y-%m-%d)"
            git push
          fi
