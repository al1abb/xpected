name: Historical appearance backfill

# Runs scripts/backfill_appearances.py — a multi-day, resumable pull of
# per-player minutes/ratings from bigballsdata.com back to 2019/20 (see
# ingest/bigballs_history.py's docstring for why that's reachable on the
# free plan despite /lineups itself being walled to "current + 1 prior
# season"). Building block for model/player_elo.py.
#
# Budget-shared with daily-refresh.yml, which also calls bigballsdata.com
# (current-season lineups/stats) every day against the same 2000/day cap.
# --budget 1500 here deliberately leaves real headroom for that step rather
# than assuming this job gets the whole daily allowance.
#
# State (data/appearances.sqlite: which dates are already done, and every
# appearance collected so far) is deliberately NOT committed to git — see
# that module's docstring for the size reasoning — so it has to survive
# between runs some other way. actions/cache does that: each run saves a
# new cache keyed on its own run id and restores the most recent one tagged
# with the shared prefix, which is the standard pattern for a cache that
# needs to keep growing across runs rather than just avoiding rebuild work.
# A cache miss (first run, or eviction) just means this run starts a fresh
# appearances.sqlite — safe, since backfill_competition() re-derives
# progress from what's actually in it, never from an external counter.
#
# Only data/app.db is committed here, and only because this process also
# resolves player identity as it goes (ingest/resolve_players.py) — new
# Player/PlayerAlias rows are real, durable, and small (no per-appearance
# blob), unlike the raw minutes/rating data that stays in the gitignored
# cache. Scheduled at 03:00 UTC, clear of daily-refresh.yml (06:00) and
# close-out-finished.yml (11:00-23:00), so the two never race for the same
# bigballsdata.com budget or the same app.db write lock.
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      budget:
        description: "Max bigballsdata.com requests to spend this run"
        default: "1500"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore appearance backfill progress
        uses: actions/cache/restore@v4
        with:
          path: data/appearances.sqlite
          key: appearances-db-${{ github.run_id }}
          restore-keys: |
            appearances-db-

      - name: Run backfill
        env:
          BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
        run: python scripts/backfill_appearances.py --budget "${{ github.event.inputs.budget || '1500' }}" --seasons-back 8

      - name: Save appearance backfill progress
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/appearances.sqlite
          key: appearances-db-${{ github.run_id }}

      - name: Commit and push if player identity data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db
          if git diff --cached --quiet; then
            echo "No new players resolved, skipping commit."
          else
            git commit -m "Historical appearance backfill: $(date -u +%Y-%m-%d)"
            git push
          fi
